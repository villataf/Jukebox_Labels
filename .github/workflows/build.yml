# Compila il programma per Windows, macOS e Linux, sia Intel (x86_64) sia ARM (aarch64).
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - name: App per macOS e pacchetto Linux con l'icona
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          cargo install cargo-bundle
          cargo bundle --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        continue-on-error: true
        with:
          name: jukebox-etichette-bundle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: jukebox-etichette-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/jukebox-etichette${{ matrix.ext }}
