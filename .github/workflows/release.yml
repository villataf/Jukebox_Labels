name: Build and Release

on:
  push:
    tags:
      - 'v*' # Si attiva automaticamente quando crei un tag es. v1.0.0
  release:
    types: [published]
    
permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- WINDOWS ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: jukebox-etichette.exe
            archive_name: jukebox-etichette-windows-amd64.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin_name: jukebox-etichette.exe
            archive_name: jukebox-etichette-windows-arm64.zip

          # --- LINUX ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: jukebox-etichette
            archive_name: jukebox-etichette-linux-amd64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: jukebox-etichette
            archive_name: jukebox-etichette-linux-arm64.tar.gz

          # --- macOS ---
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: jukebox-etichette
            archive_name: jukebox-etichette-macos-intel.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: jukebox-etichette
            archive_name: jukebox-etichette-macos-apple-silicon.tar.gz

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compila il progetto (Release)
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Prepara archivio Windows (ZIP)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          Compress-Archive -Path $bin -DestinationPath ${{ matrix.archive_name }}

      - name: Prepara archivio Linux/macOS (TAR.GZ)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          tar -czvf ${{ matrix.archive_name }} -C "$(dirname $bin)" "$(basename $bin)"

      - name: Carica l'eseguibile nella Release di GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}